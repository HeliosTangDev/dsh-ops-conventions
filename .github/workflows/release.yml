name: release

# 只在打 tag（v*）时触发：日常 push 不发版，符合"改动随便提、发版才打 tag"的节奏
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject BOM in release files
        run: |
          set -euo pipefail
          if LC_ALL=C grep -rIl $'\xEF\xBB\xBF' --include='*.json' --include='*.yml' --include='*.mjs' --include='*.md' .; then
            echo "::error::BOM found in the files above; DSH rejects package.json with a BOM"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack

      - name: Add stable-name asset for latest/download links
        run: cp dsh-ops-conventions-*.tgz dsh-ops-conventions.tgz

      - name: Verify packed package.json has no BOM
        run: |
          set -euo pipefail
          first=$(tar -xzOf dsh-ops-conventions-*.tgz package/package.json | head -c 1 | od -An -tx1 | tr -d ' \n')
          if [ "$first" != "7b" ]; then
            echo "::error::package/package.json does not start with '{' (BOM? first byte=$first)"
            exit 1
          fi

      - name: Verify asset matches tag version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag=$GITHUB_REF_NAME 与 package.json=$version 不一致"; exit 1; }
          ls -l dsh-ops-conventions-*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dsh-ops-conventions-*.tgz \
            dsh-ops-conventions.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
