name: release

# 只在打 tag（v*）时触发：日常 push 不发版，符合"改动随便提、发版才打 tag"的节奏
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack

      - name: Verify asset matches tag version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag=$GITHUB_REF_NAME 与 package.json=$version 不一致"; exit 1; }
          ls -l dsh-ops-conventions-*.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dsh-ops-conventions-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
