name: ci

on:
  push:
    branches: [main]
  pull_request:

# 新 push 自动取消同一分支上的旧 run，避免旧 run 残留
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # 真挂死在 runner 上时超时失败，而不是永远 pending（默认 360 分钟太久）
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        exclude:
          # macOS 托管 runner 排队紧张：2026-11-19 两次 push（0.9.8、narrow 编码修复）各有一个
          # macOS job 在「排队分配 runner」阶段被取消（steps 为空、runner_name 为空、约 15 分钟后 cancelled）。
          # macOS 只保留 node 24，node 22 的覆盖由 ubuntu/windows 两个平台承担。
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --version
          node --check index.mjs
          node --check rule.mjs
          node --check install.mjs

      # 直接跑测试文件（不依赖 --test 的目录扫描/子进程分发，排除环境差异）
      - name: 逻辑测试
        shell: bash
        run: |
          set -e
          ls -la test
          node test/rule.test.mjs
